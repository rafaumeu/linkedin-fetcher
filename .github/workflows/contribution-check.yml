name: Contribution Check

on:
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.10.0"
          cache: "yarn"
      - name: Install dependencies
        run: yarn install
      # Add lint fix steps before tests
      - name: Run lint fix
        run: |
          yarn lint:fix
          yarn format:fix
      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code || echo "changes=true" >> $GITHUB_OUTPUT
      - name: Commit lint fixes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "style: apply automatic formatting"
          git push origin HEAD:${{ github.head_ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup test environment
        run: |
          echo "NODE_ENV=test" > .env
          echo "DATABASE_URL=postgres://test:test@localhost:5432/test" >> .env
          echo "PORT=3333" >> .env
      # Copy test stubs instead of creating them inline
      - name: Copy test stubs to source directories
        run: |
          # Create directories if they don't exist
          mkdir -p src/services/scrapper
          mkdir -p src/services/browser
          mkdir -p src/utils/errors
          mkdir -p src/utils/extractors
          mkdir -p src/utils/profile
          mkdir -p src/utils/logger
          mkdir -p src/db
          
          # Copy stubs to their respective locations
          cp -f src/test/stubs/services/browser/browserService.ts src/services/browser/
          cp -f src/test/stubs/services/scrapper/profileScrapper.ts src/services/scrapper/
          cp -f src/test/stubs/utils/errors/AppError.ts src/utils/errors/
          cp -f src/test/stubs/utils/profile/profileUtils.ts src/utils/profile/
          cp -f src/test/stubs/utils/logger/index.ts src/utils/logger/
          cp -f src/test/stubs/db/connection.ts src/db/
          cp -f src/test/stubs/env.ts src/
      - name: Run tests
        run: yarn test
      - name: Check code coverage
        run: yarn test:coverage
