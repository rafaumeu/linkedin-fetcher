name: Contribution Check

on:
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.10.0"
          cache: "yarn"
      - name: Install dependencies
        run: yarn install
      - name: Setup test environment
        run: |
          echo "NODE_ENV=test" > .env
          echo "DATABASE_URL=postgres://test:test@localhost:5432/test" >> .env
          echo "PORT=3333" >> .env
          echo "LOAD_ENV_FILE=true" >> .env
      - name: Create test files structure
        run: |
          mkdir -p src/services/scrapper
          mkdir -p src/services/browser
          mkdir -p src/utils/errors
          mkdir -p src/utils/extractors
          mkdir -p src/utils/profile
          mkdir -p src/db
          mkdir -p src/test/setup
      - name: Run Lint
        run: yarn lint --fix
      - name: Run Format
        run: yarn format --write
      - name: Run Tests
        run: yarn test
