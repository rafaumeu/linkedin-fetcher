name: Project Automation

on:
  issues:
    types: [opened, labeled, unlabeled]
  pull_request:
    types: [opened, ready_for_review, review_requested, converted_to_draft]

jobs:
  project_automation:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      repository-projects: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/rafaumeu/projects/6
          github-token: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
      
      - name: Update Project Status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
          script: |
            const event = context.payload;
            
            // Define status based on event type
            let status = '📥 Backlog';
            if (event.pull_request) {
              if (event.pull_request.draft) {
                status = '🏗️ In Progress';
              } else if (event.action === 'ready_for_review') {
                status = '👀 Review';
              }
            } else if (event.issue) {
              status = '📋 To Do';
            }
            
            // Get project item ID
            const projectItems = await github.graphql(`
              query($org: String!, $number: Int!) {
                user(login: $org) {
                  projectV2(number: $number) {
                    items(first: 100) {
                      nodes {
                        id
                        content {
                          ... on Issue {
                            number
                          }
                          ... on PullRequest {
                            number
                          }
                        }
                      }
                    }
                  }
                }
              }
            `, {
              org: context.repo.owner,
              number: 6
            });

            // Update the status
            await github.graphql(`
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: String!) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $value }
                  }
                ) {
                  projectV2Item {
                    id
                  }
                }
              }
            `, {
              projectId: "PVT_kwHOAdW7184Ayse1",
              itemId: itemId,
              fieldId: "PVTSSF_lAHOAdW7184Ayse1zgom1ag",
              value: status
            });
      
      - name: Classify Issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title.toLowerCase();
            const body = context.payload.issue.body.toLowerCase();
            
            // Referência ao código em LinkedInAuthService.ts
            if (title.includes('auth') || body.includes('autenticação')) {
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['auth']
              });
            }
            
            // Referência ao código em LinkedInScrapper.ts
            if (title.includes('scrap') || body.includes('extração')) {
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['scraping']
              });
            }

      - name: Auto Assign PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            
            const labels = new Set();
            
            files.data.forEach(file => {
              if (file.filename.includes('test')) labels.add('testing');
              if (file.filename.includes('docker')) labels.add('docker');
              if (file.filename.includes('.github/workflows')) labels.add('ci');
              if (file.filename.endsWith('.md')) labels.add('documentation');
              if (file.filename.includes('services/')) labels.add('enhancement');
              if (file.filename.includes('database/')) labels.add('database');
            });
            
            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: Array.from(labels)
              });
            }
            
            // Referência aos serviços no código
            const services = files.data
              .filter(file => file.filename.includes('services/'))
              .map(file => file.filename.split('/').pop().split('.')[0]);
            
            if (services.length > 0) {
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: services.map(s => s.toLowerCase())
              });
            }