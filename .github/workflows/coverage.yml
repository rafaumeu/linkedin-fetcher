name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.10.0"
          cache: "yarn"
      - name: Install dependencies
        run: yarn install
      # In the Setup test environment step
      - name: Setup test environment
        run: |
          echo "NODE_ENV=test" > .env
          echo "DATABASE_URL=postgres://user:pass@localhost:5432/test" >> .env
          echo "PORT=3333" >> .env
          echo "LOAD_ENV_FILE=true" >> .env
          echo "TEST_MODE=index" >> .env
          echo "CI=true" >> .env
      # Create proper test structure
      - name: Create test files structure
        run: |
          # Create directories
          mkdir -p src/services/scrapper
          mkdir -p src/services/browser
          mkdir -p src/utils/errors
          mkdir -p src/utils/extractors
          mkdir -p src/utils/profile
          mkdir -p src/db
          mkdir -p src/test
          
          # Create basic files
          echo "export class AppError extends Error {}" > src/utils/errors/AppError.ts
          echo "export const env = { PORT: 3333 };" > src/env.ts
          echo "export const connection = {};" > src/db/connection.ts
          echo "export const domUtils = {};" > src/utils/domUtils.ts
          echo "export const browserService = {};" > src/services/browser/browserService.ts
          echo "export const profileScrapper = {};" > src/services/scrapper/profileScrapper.ts
          echo "export const profileExtractor = {};" > src/utils/extractors/profileExtractor.ts
          echo "export const profileUtils = {};" > src/utils/profile/profileUtils.ts
          
          # Create setup file
          cat > src/test/setup.ts << 'EOF'
          import { vi } from "vitest";
          vi.useFakeTimers();
          beforeEach(() => { vi.resetModules(); });
          afterEach(() => { vi.clearAllMocks(); });
          EOF
      # Fix the setupFiles path in vitest config
      - name: Fix vitest config
        run: |
          sed -i 's/srcPlease generate unit test code\/setup/src\/test\/setup/g' vitest.config.ts
      # Add this before running tests with coverage
      - name: Ensure coverage directory permissions
        run: |
          mkdir -p coverage
          chmod -R 777 coverage
      
      - name: Run tests with coverage
        run: yarn test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          flags: unittests
          fail_ci_if_error: true
