name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.10.0"
          cache: "yarn"
      - name: Install dependencies
        run: yarn install
      - name: Install rimraf globally
        run: npm install -g rimraf
      - name: Setup test environment
        run: |
          echo "NODE_ENV=test" > .env
          echo "DATABASE_URL=postgres://user:pass@localhost:5432/test" >> .env
          echo "PORT=3333" >> .env
          echo "LOAD_ENV_FILE=true" >> .env
          echo "TEST_MODE=index" >> .env
          echo "CI=true" >> .env
      # Create proper test structure
      - name: Create test files structure
        run: |
          # Create directories
          mkdir -p src/services/scrapper
          mkdir -p src/services/browser
          mkdir -p src/utils/errors
          mkdir -p src/utils/extractors
          mkdir -p src/utils/profile
          mkdir -p src/db
          mkdir -p src/test/builders
          mkdir -p src/test/factories

          # Create basic files with proper exports
          echo "export const env = { NODE_ENV: 'test', DATABASE_URL: 'postgres://test:test@localhost:5432/test', PORT: 3333 };" > src/env.ts
          echo "export class AppError extends Error { constructor(message: string, public statusCode = 400) { super(message); } }" > src/utils/errors/AppError.ts
          echo "export const connection = { query: async () => ({ rows: [] }) };" > src/db/connection.ts
          echo "export const domUtils = { getElementText: () => '' };" > src/utils/domUtils.ts
          echo "export const browserService = { launch: async () => ({}) };" > src/services/browser/browserService.ts
          echo "export class LinkedinProfileScrapper { async scrape() { return {}; } }" > src/services/scrapper/profileScrapper.ts
          echo "export const profileExtractor = { extract: () => ({}) };" > src/utils/extractors/profileExtractor.ts
          echo "export const profileUtils = { format: () => ({}) };" > src/utils/profile/profileUtils.ts
          echo "export const errorHandler = (err, req, res, next) => { res.status(500).send('Error'); };" > src/utils/errors/errorHandler.ts

          # Create test helpers
          echo "export class ProfileBuilder { build() { return {}; } }" > src/test/builders/ProfileBuilder.ts
          echo "export const createMockProfile = () => ({})" > src/test/factories/profileData.ts

          # Create setup file with proper configuration
          cat > src/test/setup.ts << 'EOF'
          import { afterAll, beforeAll, beforeEach, afterEach, vi } from "vitest";

          // Setup fake timers for all tests
          beforeAll(() => {
            vi.useFakeTimers();
          });

          // Reset modules before each test
          beforeEach(() => {
            vi.resetModules();
          });

          // Clear all mocks after each test
          afterEach(() => {
            vi.clearAllMocks();
          });

          // Restore real timers after all tests
          afterAll(() => {
            vi.useRealTimers();
          });
          EOF

      # Update vitest config to properly resolve modules
      - name: Update vitest config
        run: |
          cat > vitest.config.ts << 'EOF'
          import { resolve } from "node:path";
          import { defineConfig } from "vitest/config";
          import tsconfigPaths from "vite-tsconfig-paths";

          export default defineConfig({
            plugins: [tsconfigPaths()],
            test: {
              environment: "node",
              setupFiles: ["./src/test/setup.ts"],
              include: ["**/*.{test,spec}.{js,mjs,cjs,ts,mts,cts,jsx,tsx}"],
              coverage: {
                provider: "v8",
                enabled: true,
                reporter: ["text", "json", "html"],
                reportsDirectory: "./coverage"
              },
            },
            resolve: {
              alias: {
                "@": resolve(__dirname, "./src"),
                "./env": resolve(__dirname, "./src/env"),
                "./connection": resolve(__dirname, "./src/db/connection"),
                "./domUtils": resolve(__dirname, "./src/utils/domUtils"),
                "./AppError": resolve(__dirname, "./src/utils/errors/AppError"),
                "./errorHandler": resolve(__dirname, "./src/utils/errors/errorHandler"),
                "./profileExtractor": resolve(__dirname, "./src/utils/extractors/profileExtractor"),
                "./profileUtils": resolve(__dirname, "./src/utils/profile/profileUtils"),
              }
            }
          });
          EOF

      # Ensure coverage directory permissions
      - name: Ensure coverage directory permissions
        run: |
          mkdir -p coverage
          chmod -R 777 coverage

      - name: Run tests with coverage
        run: yarn test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          flags: unittests
          fail_ci_if_error: true
