name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20.10.0"
          cache: "yarn"
      - name: Install dependencies
        run: yarn install
      - name: Setup test environment
        run: |
          echo "NODE_ENV=test" > .env
          echo "DATABASE_URL=postgres://test:test@localhost:5432/test" >> .env
          echo "PORT=3333" >> .env
          echo "LOAD_ENV_FILE=true" >> .env
      # Create proper test structure
      - name: Create test files structure
        run: |
          mkdir -p src/services/scrapper
          mkdir -p src/services/browser
          mkdir -p src/utils/errors
          mkdir -p src/utils/extractors
          mkdir -p src/utils/profile
          mkdir -p src/db
          mkdir -p src/test
          touch src/test/setup.ts
      # Fix the setupFiles path in vitest config
      - name: Fix vitest config
        run: |
          sed -i 's/srcPlease generate unit test code\/setup/src\/test\/setup/g' vitest.config.ts
      - name: Run tests with coverage
        run: yarn test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          flags: unittests
          fail_ci_if_error: true
