name: Auto Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  auto-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.0.0'
          
      - name: Install dependencies
        run: yarn install
        
      - name: Run Code Analysis with Biome
        run: npx biome check .  # Executa a verificação de código com Biome
        
      - name: Security Check
        uses: reviewdog/action-detect-secrets@v0.12
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          
      - name: Auto Approve Minor Changes
        if: github.event.pull_request.additions < 50 && github.event.pull_request.deletions < 50
        uses: hmarr/auto-approve-action@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Comment on Large Changes
        if: github.event.pull_request.additions >= 50 || github.event.pull_request.deletions >= 50
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Esta PR contém muitas alterações. Por favor, considere dividir em PRs menores para facilitar a revisão.'
            }); 