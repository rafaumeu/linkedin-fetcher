name: Auto Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  auto-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.0.0'
          
      - name: Install dependencies
        run: yarn install
        
      - name: Run Code Analysis with Biome
        run: npx biome check .  # Executa a verificação de código com Biome
        
      - name: Security Check
        uses: reviewdog/action-detect-secrets@v0.28
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          
      - name: Comment on PR Status
        uses: actions/github-script@v7
        with:
          script: |
            const additions = context.payload.pull_request.additions;
            const deletions = context.payload.pull_request.deletions;
            
            if (additions < 50 && deletions < 50) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '✅ This PR contains minor changes and has passed automated checks.'
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '⚠️ This PR contains significant changes. Please consider breaking it into smaller PRs for easier review.'
              });
            }